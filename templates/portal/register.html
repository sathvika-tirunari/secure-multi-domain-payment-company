{% extends "base.html" %}{% block title %}Register{% endblock %}{% block content %}
<div class="card" style="max-width:460px;margin:auto"><h1>Create demo account</h1><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label for="username">Username</label><input id="username" name="username" value="{{ username or '' }}" maxlength="30" required>
<label for="email">Email</label><input id="email" name="email" type="email" value="{{ email or '' }}" maxlength="254" required>
<label for="password">Password</label><input id="password" name="password" type="password" maxlength="128" required autocomplete="new-password"><small>10+ characters, with a letter and a number</small>
<label for="confirm">Confirm password</label><input id="confirm" name="confirm" type="password" maxlength="128" required autocomplete="new-password">
<button class="primary" type="submit">Register</button></form></div>{% endblock %}
